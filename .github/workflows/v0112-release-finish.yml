name: V0.11.2 Release Finish

on:
  push:
    branches:
      - codex/v0112-gameday-stories-interactions
    paths:
      - .github/workflows/v0112-release-finish.yml

permissions:
  contents: write

concurrency:
  group: v0112-release-finish
  cancel-in-progress: false

jobs:
  validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0112-gameday-stories-interactions
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Bump release version to 0.11.2
        shell: bash
        run: |
          printf '0.11.2\n' > VERSION.txt
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          p.version='0.11.2';
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          let app=fs.readFileSync('app.js','utf8');
          if(!/APP_VERSION='[^']+'/.test(app)) throw new Error('APP_VERSION source not found');
          app=app.replace(/APP_VERSION='[^']+'/,"APP_VERSION='0.11.2'");
          fs.writeFileSync('app.js',app);
          NODE

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Build release artifact
        run: npm run build

      - name: Verify version and smoke plumbing
        run: node tests/version.js && node tests/smoke.js

      - name: Locate Chromium
        id: chromium
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            npx playwright-core install chromium
            browser="$(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chromium \) | head -1)"
          fi
          test -n "$browser"
          echo "path=$browser" >> "$GITHUB_OUTPUT"

      - name: Browser UI and visual regression tests
        run: npm run test:browser
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}

      - name: Browser IndexedDB regression check
        run: npm run test:browser-storage
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}

      - name: Simulation audit
        run: npm run audit

      - name: Commit release candidate and retire helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION.txt package.json app.js index.html tests/game-engine-v2-recorded-browser.js
          git rm .github/workflows/v0112-release-finish.yml
          git commit -m "release: validate Dynasty Lab v0.11.2 production"

      - name: Verify clean reproducible release source
        run: |
          npm run build
          git diff --exit-code -- index.html
          npm run verify:release
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Push validated release source
        run: git push origin HEAD:codex/v0112-gameday-stories-interactions

      - name: Publish production
        run: node tools/publish.js

      - name: Verify production commit
        shell: bash
        run: |
          git fetch origin +refs/heads/gh-pages:refs/remotes/origin/gh-pages
          test "$(git log -1 refs/remotes/origin/gh-pages --format=%s)" = "Publish production: 0.11.2"
          echo "Production v0.11.2 verified on gh-pages at $(git rev-parse refs/remotes/origin/gh-pages)"
