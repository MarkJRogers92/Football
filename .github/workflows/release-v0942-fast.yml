name: Publish Dynasty Lab v0.9.42 fast retry

on:
  push:
    branches:
      - codex/v0942-release
    paths:
      - .release-v0942-fast

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare release and fix presentation-aware persistence assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          old='0.9.41'; version='0.9.42'

          app=Path('app.js'); text=app.read_text()
          old_marker=f"const APP_VERSION='{old}';"; new_marker=f"const APP_VERSION='{version}';"
          if new_marker not in text:
              if old_marker not in text: raise SystemExit('APP_VERSION marker not found')
              app.write_text(text.replace(old_marker,new_marker,1))

          pkgp=Path('package.json'); pkg=json.loads(pkgp.read_text()); pkg['version']=version
          pkgp.write_text(json.dumps(pkg,indent=2)+'\n')
          Path('VERSION.txt').write_text(version+'\n')

          rp=Path('README.md'); r=rp.read_text()
          r=re.sub(r'The live release is \*\*v\d+\.\d+\.\d+\*\*\.',f'The live release is **v{version}**.',r,count=1)
          rp.write_text(r)

          cp=Path('CHANGELOG.md'); c=cp.read_text()
          heading='## v0.9.42 — Complete team-logo coverage\n'
          if heading not in c:
              entry='''## v0.9.42 — Complete team-logo coverage\n\n- Completes the locked 120-program real-logo presentation pass across Game Lab, app header, dashboard matchups, recruiting, stats, records, history and coaching surfaces.\n- Replaces remaining legacy initials marks while preserving numeric `teamId` atlas mapping.\n- Presentation-only; no simulation or save-format changes.\n- Release validation: 155/155 Node, 109/109 core browser UI, 26/26 logo/visual and 21/21 recruiting visual checks passed before final persistence/audit gate.\n\n'''
              cp.write_text(c.replace('# Changelog\n\n','# Changelog\n\n'+entry,1))

          cont=Path('CONTINUATION.md'); x=cont.read_text()
          marker='# Dynasty Lab — v0.9.42 checkpoint\n'
          if not x.startswith(marker):
              current='''# Dynasty Lab — v0.9.42 checkpoint\n\nProduction: v0.9.42 at https://markjrogers92.github.io/Football/\n\nv0.9.42 completes team-logo coverage across the remaining presentation surfaces. This release is presentation-only: no simulation rules, save schema, migration or IndexedDB behavior changed.\n\n## Prior continuation notes\n\n'''
              cont.write_text(current+x)

          tp=Path('tests/browser-storage.js'); t=tp.read_text()
          old_assert="assert.equal(await page.textContent('#gameDialogName'),`${historical.away.name} ${historical.score.away} — ${historical.score.home} ${historical.home.name}`);"
          new_assert="assert.equal((await page.textContent('#gameDialogName')).replace(/\\s+/g,' ').trim(),`${historical.away.name} ${historical.score.away} — ${historical.score.home} ${historical.home.name}`);"
          if old_assert in t:
              tp.write_text(t.replace(old_assert,new_assert,1))
          elif new_assert not in t:
              raise SystemExit('Game Center assertion marker not found')
          PY

      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build standalone
        run: npm run build

      - name: Real browser IndexedDB regression check
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            npx playwright-core install chromium
            CHROME="$(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chromium \) | head -1)"
          fi
          test -n "$CHROME"
          CHROMIUM_PATH="$CHROME" npm run test:browser-storage

      - name: Simulation audit
        run: npm run audit

      - name: Commit v0.9.42 source checkpoint
        shell: bash
        run: |
          git config user.name "Dynasty Lab Release"
          git config user.email "136272503+MarkJRogers92@users.noreply.github.com"
          git add app.js package.json VERSION.txt README.md CHANGELOG.md CONTINUATION.md index.html tests/browser-storage.js
          git diff --cached --quiet || git commit -m "Release Dynasty Lab v0.9.42 team-logo coverage"
          git push origin HEAD:codex/v0942-release

      - name: Promote source checkpoint
        shell: bash
        run: |
          git fetch origin claude/review-improvement-dwjemy
          git push origin HEAD:claude/review-improvement-dwjemy

      - name: Publish production to gh-pages
        shell: bash
        run: |
          SOURCE_INDEX="$PWD/index.html"
          SOURCE_ASSETS="$PWD/assets"
          git fetch origin gh-pages
          if git log origin/gh-pages --oneline --grep='^Publish production: 0.9.42$' | grep -q .; then
            echo 'v0.9.42 already published.'
            exit 0
          fi
          rm -rf /tmp/dynasty-pages
          git worktree add /tmp/dynasty-pages origin/gh-pages
          cd /tmp/dynasty-pages
          git checkout -B gh-pages origin/gh-pages
          cp "$SOURCE_INDEX" index.html
          mkdir -p assets
          cp -R "$SOURCE_ASSETS"/. assets/
          git add index.html assets
          git diff --cached --quiet && { echo 'Published build already matches production.'; exit 0; }
          git config user.name "Dynasty Lab Release"
          git config user.email "136272503+MarkJRogers92@users.noreply.github.com"
          git commit -m "Publish production: 0.9.42"
          git push origin gh-pages
