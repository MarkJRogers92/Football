name: Publish v0.11.9 production now

on:
  push:
    branches:
      - codex/v0119-options-about
    paths:
      - .github/workflows/publish-v0119-now.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dbd5154679703f48ef047334728d4ccdc0a998fe
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Validate and publish v0.11.9
        run: npm run publish
