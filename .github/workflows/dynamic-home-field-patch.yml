name: Dynamic home-field baseline diagnostic

on:
  push:
    branches:
      - codex/dynamic-home-field-quick-sim

permissions:
  contents: read

jobs:
  baseline-recap:
    if: github.event.head_commit.message == 'Check baseline recap seed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Run untouched recap tests
        run: node --test tests/recaps.js
