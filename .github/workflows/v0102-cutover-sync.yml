name: V0.10.2 Cutover Checkpoint

on:
  push:
    branches:
      - codex/v0102-v2-detailed-cutover
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v0102-cutover-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-sync:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[v0102-sync]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Parse cutover module
        run: node --check game-engine-v2-cutover.js
      - name: Game Engine 2 targeted suite
        run: npm run test:game-engine-v2
      - name: Frozen calibration gate
        run: npm run test:game-engine-v2-calibration
      - name: Build standalone artifact
        run: npm run build
      - name: Locate Chromium
        id: chromium
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            npx playwright-core install chromium
            browser="$(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chromium \) | head -1)"
          fi
          test -n "$browser"
          echo "path=$browser" >> "$GITHUB_OUTPUT"
      - name: Transaction rollback regression
        run: npm run test:game-engine-v2-recorded-browser
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}
      - name: Six-week recorded-game regression
        run: npm run test:game-engine-v2-multiweek-browser
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}
      - name: Normal Detailed Game cutover regression
        run: npm run test:game-engine-v2-cutover-browser
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}
      - name: Sync tested standalone build
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "build: sync v0.10.2 Detailed Game cutover [v0102-sync]"
          git push
