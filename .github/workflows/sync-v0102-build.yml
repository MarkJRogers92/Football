name: Sync v0.10.2 weekly coaching build

on:
  push:
    branches:
      - codex/v0102-weekly-coaching-loop
    paths:
      - .github/workflows/sync-v0102-build.yml

permissions:
  contents: write

concurrency:
  group: v0102-build-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build standalone artifact
        run: npm run build
      - name: Commit synchronized artifact and remove helper
        shell: bash
        run: |
          git rm --ignore-unmatch .github/workflows/sync-v0102-build.yml
          git add index.html
          if git diff --cached --quiet; then
            echo "No synchronized changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: sync v0.10.2 weekly coaching artifact"
          git push
