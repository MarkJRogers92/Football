name: team branding coverage validation

on:
  push:
    branches:
      - codex/team-branding-coverage
  pull_request:
    branches:
      - claude/review-improvement-dwjemy

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build standalone
        run: npm run build
      - name: Team branding and Game Lab regression tests
        run: node --test tests/teambranding.js tests/gamelab.js
      - name: Desktop and iPhone visual coverage checks
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            npx playwright-core install chromium
            CHROME="$(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chromium \) | head -1)"
          fi
          test -n "$CHROME"
          CHROMIUM_PATH="$CHROME" node tests/visual.js
