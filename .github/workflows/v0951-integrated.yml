name: v0951 matrix validation

on:
  push:
    branches:
      - codex/v0951-integrated
  pull_request:
    branches:
      - claude/review-improvement-dwjemy

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-package-lock
      - run: npm run build
      - name: Commit rebuilt standalone artifact
        if: ${{ github.event_name == 'push' }}
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Rebuild integrated v0.9.51 artifact [skip ci]"
            git push origin HEAD:codex/v0951-integrated
          fi
      - run: git diff --exit-code -- index.html
      - run: npm run verify:release

  node-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        test:
          - tests/rng.js
          - tests/rng-integration.js
          - tests/rng-domain2.js
          - tests/rng-domain3.js
          - tests/rng-domain4.js
          - tests/adminconfidence.js
          - tests/season-goals.js
          - tests/signingday.js
          - tests/transfers.js
          - tests/scouting.js
          - tests/portal-recruiting.js
          - tests/games.js
          - tests/gamelab.js
          - tests/bowls.js
          - tests/gameplan.js
          - tests/persistence.js
          - tests/storage.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-package-lock
      - run: node --test \${{ matrix.test }}

  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-package-lock
      - name: Locate Chromium
        id: chromium
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            npx playwright-core install chromium
            browser="$(find "$HOME/.cache/ms-playwright" -type f \\( -name chrome -o -name chromium \\) | head -1)"
          fi
          test -n "$browser"
          echo "path=$browser" >> "$GITHUB_OUTPUT"
      - run: npm run test:browser
        env:
          CHROMIUM_PATH: \${{ steps.chromium.outputs.path }}
      - run: npm run test:browser-storage
        env:
          CHROMIUM_PATH: \${{ steps.chromium.outputs.path }}
