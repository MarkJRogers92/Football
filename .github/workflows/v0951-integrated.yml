name: v0951 integrated build

on:
  push:
    branches:
      - codex/v0951-integrated

permissions:
  contents: write

jobs:
  build:
    if: \${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0951-integrated
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build standalone artifact
        run: npm run build
      - name: Commit generated index if changed
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Rebuild integrated v0.9.51 artifact [skip ci]"
            git push origin HEAD:codex/v0951-integrated
          fi
