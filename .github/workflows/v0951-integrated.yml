name: v0951 integrated validation

on:
  push:
    branches:
      - codex/v0951-integrated

permissions:
  contents: write

jobs:
  validate:
    if: \${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0951-integrated
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build standalone artifact
        run: npm run build
      - name: Full Node suite
        run: npm test
      - name: Install Chromium for browser suites
        run: |
          npx --yes playwright@1.49.0 install --with-deps chromium
          CHROME=$(find "$HOME/.cache/ms-playwright" -type f \\( -name chrome -o -name headless_shell \\) | head -1)
          test -n "$CHROME"
          echo "CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: Browser suites
        run: npm run test:browser
      - name: Commit generated index if changed
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Rebuild integrated v0.9.51 artifact [skip ci]"
            git push origin HEAD:codex/v0951-integrated
          fi
