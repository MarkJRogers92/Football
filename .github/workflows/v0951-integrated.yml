name: v0951 targeted validation

on:
  push:
    branches:
      - codex/v0951-integrated
  pull_request:
    branches:
      - claude/review-improvement-dwjemy

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build and release checks
        run: |
          npm run build
          git diff --exit-code -- index.html
          npm run verify:release
      - name: Focused integrated Node regression
        run: node --test tests/rng.js tests/rng-integration.js tests/rng-domain2.js tests/rng-domain3.js tests/rng-domain4.js tests/adminconfidence.js tests/season-goals.js tests/signingday.js tests/transfers.js tests/scouting.js tests/portal-recruiting.js tests/games.js tests/gamelab.js tests/bowls.js tests/gameplan.js tests/persistence.js tests/storage.js
      - name: Locate Chromium
        id: chromium
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            npx playwright-core install chromium
            browser="$(find "$HOME/.cache/ms-playwright" -type f \\( -name chrome -o -name chromium \\) | head -1)"
          fi
          test -n "$browser"
          echo "path=$browser" >> "$GITHUB_OUTPUT"
      - name: Browser UI and visual regression
        run: npm run test:browser
        env:
          CHROMIUM_PATH: \${{ steps.chromium.outputs.path }}
      - name: Browser storage regression
        run: npm run test:browser-storage
        env:
          CHROMIUM_PATH: \${{ steps.chromium.outputs.path }}
