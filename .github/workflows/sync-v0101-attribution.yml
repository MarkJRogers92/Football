name: Sync v0.10.1 Player Attribution

on:
  push:
    branches:
      - codex/v0101-player-attribution

permissions:
  contents: write
  actions: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Targeted Game Engine 2 attribution tests
        run: npm run test:game-engine-v2
      - name: Recalibrate explicit pass and sack semantics
        run: |
          node tools/game-engine-v2-compare.js docs/v0100-CALIBRATION.json
          node tools/game-engine-v2-calibration-stamp.js docs/v0100-CALIBRATION.json
          cat docs/v0100-CALIBRATION.json
      - name: Enforce calibration guardrails
        run: npm run test:game-engine-v2-calibration
      - name: Build standalone artifact
        run: npm run build
      - name: Verify attribution is packaged
        run: |
          grep -q "DynastyGameEngineV2Attribution" index.html
          grep -q "Real-player shadow box" index.html
      - name: Commit synchronized artifact, calibration and remove helper
        run: |
          rm .github/workflows/sync-v0101-attribution.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html docs/v0100-CALIBRATION.json .github/workflows/sync-v0101-attribution.yml
          git commit -m "build: sync v0.10.1 player attribution [skip ci]"
          git push origin HEAD:codex/v0101-player-attribution
      - name: Dispatch validator on synchronized head
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run validate.yml --ref codex/v0101-player-attribution
