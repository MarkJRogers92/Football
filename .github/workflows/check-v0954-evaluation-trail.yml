name: Check v0.9.54 evaluation trail prototype

on:
  push:
    branches:
      - codex/v0954-evaluation-trail-prototype

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-package-lock
      - name: Focused evaluation trail tests
        run: node --test tests/scouting-actions.js tests/scouting-trail.js
      - name: Build standalone prototype
        run: npm run build
      - name: Verify evaluation trail is bundled
        run: |
          grep -q "EVALUATION TRAIL" index.html
          grep -q "receipt of changes to the staff report" index.html
      - name: Locate Chromium
        id: chromium
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            npx playwright-core install chromium
            browser="$(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chromium \) | head -1)"
          fi
          test -n "$browser"
          echo "path=$browser" >> "$GITHUB_OUTPUT"
      - name: Browser evaluation trail lifecycle
        run: node tests/scouting-trail-browser.js
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}
