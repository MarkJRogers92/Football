name: Publish v0.9.52 Now

on:
  push:
    branches:
      - codex/v0952-program-goals-polish

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-package-lock
      - name: Publish production
        run: node tools/publish.js
