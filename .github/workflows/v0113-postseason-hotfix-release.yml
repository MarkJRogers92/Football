name: Release Dynasty Lab v0.11.3 Postseason Hotfix

on:
  push:
    branches:
      - codex/v0112-next-action-hotfix
    paths:
      - '.github/workflows/v0113-postseason-hotfix-release.yml'

permissions:
  contents: write

concurrency:
  group: dynasty-publish
  cancel-in-progress: false

jobs:
  release-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0112-next-action-hotfix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare v0.11.3
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          version='0.11.3'
          Path('VERSION.txt').write_text(version+'\n')

          p=Path('package.json')
          data=json.loads(p.read_text())
          data['version']=version
          p.write_text(json.dumps(data,indent=2)+'\n')

          p=Path('app.js')
          s=p.read_text()
          s2,n=re.subn(r"APP_VERSION='[^']+'", "APP_VERSION='0.11.3'", s, count=1)
          if n != 1:
              raise SystemExit('APP_VERSION anchor not found exactly once')
          p.write_text(s2)
          PY
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build standalone artifact
        run: npm run build
      - name: Fast release checks
        run: node tests/version.js && node tests/smoke.js && node --test tests/next-action.js tests/weeklyplan.js
      - name: Locate Chromium
        id: chromium
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            npx playwright-core install chromium
            browser="$(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chromium \) | head -1)"
          fi
          test -n "$browser"
          echo "path=$browser" >> "$GITHUB_OUTPUT"
      - name: Recheck iPhone postseason flow
        run: node tests/postseason-next-action-browser.js
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}
      - name: Commit release source and retire helper
        shell: bash
        run: |
          rm .github/workflows/v0113-postseason-hotfix-release.yml
          git add VERSION.txt package.json app.js index.html .github/workflows/v0113-postseason-hotfix-release.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'release: Dynasty Lab v0.11.3 postseason hotfix'
      - name: Verify clean reproducible release
        run: npm run verify:release
      - name: Push release source
        run: git push origin HEAD:codex/v0112-next-action-hotfix
      - name: Publish production
        run: node tools/publish.js
      - name: Verify production commit
        shell: bash
        run: |
          git fetch origin gh-pages
          subject="$(git log -1 --format=%s origin/gh-pages)"
          echo "$subject"
          test "$subject" = 'Publish production: 0.11.3'
