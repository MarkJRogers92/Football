name: v095 coach relationships implementation

on:
  push:
    branches:
      - codex/v095-coach-relationships

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reassemble bounded v0.9.5 patch
        shell: bash
        run: |
          cat tools/v095_patch.b64.* | base64 -d > tools/v095_patch.py
          test "$(wc -c < tools/v095_patch.py)" -eq 36591
          echo "9eed456601f8f41a45db160242ecca066c3ee30bfbd43a9a1b4de8479b305777  tools/v095_patch.py" | sha256sum -c -
          python3 -m py_compile tools/v095_patch.py
      - name: Apply bounded v0.9.5 patch
        run: python3 tools/v095_patch.py
      - name: Install test dependencies
        run: npm install --no-package-lock
      - name: Build standalone
        run: npm run build
      - name: Engine, persistence and relationship tests
        run: npm test
      - name: Browser UI tests
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            npx playwright-core install chromium
            CHROME="$(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chromium \) | head -1)"
          fi
          test -n "$CHROME"
          CHROMIUM_PATH="$CHROME" npm run test:browser
      - name: Browser IndexedDB tests
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then CHROME="$(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chromium \) | head -1)"; fi
          test -n "$CHROME"
          CHROMIUM_PATH="$CHROME" npm run test:browser-storage
      - name: Short simulation audit
        run: SEASONS=2 npm run audit
      - name: Commit validated v0.9.5 source
        shell: bash
        run: |
          rm -f .github/workflows/v095-implement.yml tools/v095_patch.py tools/v095_patch.b64.*
          git config user.name "Dynasty Lab CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Carry coach relationships across schools in v0.9.5"
          git push origin HEAD:codex/v095-coach-relationships
      - name: Publish review preview
        run: npm run publish:preview -- v095-coach-relationships
