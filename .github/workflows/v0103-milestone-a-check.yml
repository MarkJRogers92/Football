name: V0.10.3 Milestone A checkpoint

on:
  push:
    branches:
      - codex/v0103-premium-client-shell
    paths:
      - .github/workflows/v0103-milestone-a-check.yml

permissions:
  contents: write

concurrency:
  group: v0103-milestone-a-check
  cancel-in-progress: false

# Re-run from the browser-routing-compatible head.
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build standalone artifact
        run: npm run build
      - name: Locate Chromium
        id: chromium
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            npx playwright-core install chromium
            browser="$(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chromium \) | head -1)"
          fi
          test -n "$browser"
          echo "path=$browser" >> "$GITHUB_OUTPUT"
      - name: Premium client shell regression
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}
        run: node tests/client-shell-browser.js
      - name: Mobile persistence utility regression
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}
        run: node tests/browser-storage.js
      - name: Weekly starter-pressure regression
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}
        run: node tests/weekly-personnel-browser.js
      - name: Commit synchronized artifact and remove helper
        shell: bash
        run: |
          git rm --ignore-unmatch .github/workflows/v0103-milestone-a-check.yml
          git add index.html
          if git diff --cached --quiet; then
            echo "No synchronized changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: checkpoint Milestone A premium client shell"
          git push
