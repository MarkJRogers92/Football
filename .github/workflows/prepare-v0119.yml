name: Prepare v0.11.9 release

on:
  push:
    branches:
      - codex/v0119-options-about
    paths:
      - .github/workflows/prepare-v0119.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bump release version
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const next='0.11.9';
          fs.writeFileSync('VERSION.txt',next+'\n');
          let app=fs.readFileSync('app.js','utf8');
          const old="const APP_VERSION='0.11.8'";
          const fresh=`const APP_VERSION='${next}'`;
          if(!app.includes(old)) throw new Error('Expected APP_VERSION 0.11.8 not found');
          app=app.replace(old,fresh);
          fs.writeFileSync('app.js',app);
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          if(pkg.version!=='0.11.8') throw new Error(`Expected package version 0.11.8, found ${pkg.version}`);
          pkg.version=next;
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          NODE
      - name: Rebuild standalone artifact
        run: node tools/build.js
      - name: Commit release candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION.txt app.js package.json index.html
          git commit -m "release: Dynasty Lab v0.11.9 Options and About menus"
          git push origin HEAD:${GITHUB_REF_NAME}
