name: V0.10.2 Full Season V2 Soak

on:
  push:
    branches:
      - codex/v0102-v2-full-season-soak
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v0102-full-season-soak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Verify committed standalone build is current
        run: npm run build && git diff --exit-code -- index.html
      - name: Game Engine 2 targeted suite
        run: npm run test:game-engine-v2
      - name: Frozen calibration gate
        run: npm run test:game-engine-v2-calibration
      - name: Locate Chromium
        id: chromium
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            npx playwright-core install chromium
            browser="$(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chromium \) | head -1)"
          fi
          test -n "$browser"
          echo "path=$browser" >> "$GITHUB_OUTPUT"
      - name: Normal Detailed Game cutover regression
        run: npm run test:game-engine-v2-cutover-browser
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}
      - name: Full regular-season Detailed Game v2 soak
        run: npm run test:game-engine-v2-season-soak-browser
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}
