name: V0.11.2 Next Action Hotfix

on:
  push:
    branches:
      - codex/v0112-next-action-hotfix

permissions:
  contents: write

jobs:
  validate-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0112-next-action-hotfix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch postseason controls and warning copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          body=Path('body.html')
          s=body.read_text()
          old='''          <button id="simConf" disabled>Conference Championships</button>\n          <button id="simPlayoff" disabled>Sim 16-Team Playoff</button>'''
          new='''          <button id="simConf" disabled>Conference Championships</button>\n          <button id="simBowls" disabled>Bowl Games</button>\n          <button id="simPlayoff" disabled>Sim 16-Team Playoff</button>'''
          if old not in s:
              raise SystemExit('body postseason controls anchor not found')
          body.write_text(s.replace(old,new,1))

          app=Path('app.js')
          s=app.read_text()
          old="out.push(planStep('over','Get under the scholarship limit',`${sch.over} over. Signing day will pull your weakest commitments for you.`,'recruiting',false,92));"
          new="out.push(planStep('over','Scholarship limit warning',`${sch.over} over. This does not block postseason; signing day will pull your weakest commitments for you.`,'recruiting',false,92));"
          if old not in s:
              raise SystemExit('scholarship warning anchor not found')
          s=s.replace(old,new,1)

          old="$('#simConf').disabled=universe.phase!=='confReady';$('#simPlayoff').disabled=!['bowlReady','playoffReady'].includes(universe.phase);"
          new="$('#simConf').disabled=universe.phase!=='confReady';$('#simBowls').disabled=universe.phase!=='bowlReady';$('#simPlayoff').disabled=universe.phase!=='playoffReady';"
          if old not in s:
              raise SystemExit('render postseason controls anchor not found')
          s=s.replace(old,new,1)

          old="$('#simWeek').onclick=simWeek;$('#hubAdvance').onclick=simWeek;$('#seasonWeek').onclick=simWeek;$('#simSeason').onclick=simSeason;$('#simConf').onclick=simConferenceChampionships;$('#simPlayoff').onclick=simPlayoff;"
          new="$('#simWeek').onclick=simWeek;$('#hubAdvance').onclick=simWeek;$('#seasonWeek').onclick=simWeek;$('#simSeason').onclick=simSeason;$('#simConf').onclick=simConferenceChampionships;$('#simBowls').onclick=simBowls;$('#simPlayoff').onclick=simPlayoff;"
          if old not in s:
              raise SystemExit('bind postseason controls anchor not found')
          s=s.replace(old,new,1)
          app.write_text(s)
          PY
      - name: Add focused browser regression
        shell: bash
        run: |
          cat > tests/postseason-next-action-browser.js <<'JS'
          const assert=require('node:assert/strict');
          const path=require('path');
          const {chromium}=require('playwright-core');
          async function startNewDynasty(page){
            await page.waitForSelector('#titleNew',{timeout:30000});
            await page.waitForFunction(()=>document.querySelector('#titleTeam')?.options.length>0,{timeout:60000});
            await page.click('#titleNew');
            await page.waitForSelector('#titleStart',{state:'visible',timeout:10000});
            await page.click('#titleStart');
            await page.waitForFunction(()=>document.querySelector('#userTeam')?.options.length>0,{timeout:60000});
          }
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROMIUM_PATH||'/usr/bin/google-chrome',args:['--no-sandbox']});
            const page=await browser.newPage({viewport:{width:390,height:844}}),errors=[];
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});page.on('pageerror',e=>errors.push(String(e)));
            try{
              await page.goto('file://'+path.join(__dirname,'..','index.html'));
              await startNewDynasty(page);
              await page.click('#simSeason');
              await page.waitForFunction(()=>!document.querySelector('#simConf').disabled,{timeout:60000});
              assert.match(await page.locator('#hubAdvance').innerText(),/conference championships/i);
              await page.click('#hubAdvance');
              await page.waitForFunction(()=>!document.querySelector('#simBowls').disabled,{timeout:30000});
              assert.match(await page.locator('#hubAdvance').innerText(),/bowl games/i);
              await page.click('#hubAdvance');
              await page.waitForFunction(()=>!document.querySelector('#simPlayoff').disabled,{timeout:30000});
              assert.match(await page.locator('#hubAdvance').innerText(),/playoff/i);
              await page.click('#hubAdvance');
              await page.waitForFunction(()=>document.querySelector('#simPlayoff').disabled,{timeout:30000});
              const text=await page.locator('#weeklyPlan').innerText();
              assert.match(text,/Scholarship limit warning|Run season review|Process departures|Enroll the signing class|Nothing pending/i);
              assert.doesNotMatch(text,/Get under the scholarship limit/i);
              assert.deepEqual(errors,[],`browser emitted errors: ${errors.join('\n')}`);
              console.log('PASS postseason Next advances conf -> bowls -> playoff and warnings stay non-blocking');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build standalone artifact
        run: npm run build
      - name: Unit regression
        run: node --test tests/next-action.js tests/weeklyplan.js
      - name: Locate Chromium
        id: chromium
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            npx playwright-core install chromium
            browser="$(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chromium \) | head -1)"
          fi
          test -n "$browser"
          echo "path=$browser" >> "$GITHUB_OUTPUT"
      - name: Focused mobile postseason regression
        run: node tests/postseason-next-action-browser.js
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}
      - name: Existing browser smoke
        run: node tests/browser.js
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}
      - name: Verify reproducible release artifact
        run: npm run verify:release
      - name: Commit validated hotfix and retire helper
        shell: bash
        run: |
          rm .github/workflows/v0112-next-action-hotfix.yml
          git add next-action.js tests/next-action.js body.html app.js index.html tests/postseason-next-action-browser.js .github/workflows/v0112-next-action-hotfix.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: make postseason next action unambiguous'
          git push origin HEAD:codex/v0112-next-action-hotfix
