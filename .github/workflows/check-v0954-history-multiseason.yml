name: Check v0.9.54 multi-season recruiting history

on:
  push:
    branches:
      - codex/v0954-history-multiseason-check-final

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-package-lock
      - name: Multi-season recruiting history lifecycle
        run: node tests/recruiting-history-multiseason.js
