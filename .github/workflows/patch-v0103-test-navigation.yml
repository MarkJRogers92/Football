name: Patch v0.10.3 browser test routing

on:
  push:
    branches:
      - codex/v0103-premium-client-shell
    paths:
      - .github/workflows/patch-v0103-test-navigation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Update functional browser helpers for hidden legacy group nav
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacement='const goTab=async(page,id)=>page.evaluate(({id,group})=>{const g=document.querySelector(`.tab-groups button[data-group="${group}"]`);if(g&&!g.classList.contains("active"))g.click();document.querySelector(`.tabs button[data-tab="${id}"]`)?.click()},{id,group:TAB_GROUP[id]});'
          changed=[]
          leftovers=[]
          for p in Path('tests').rglob('*.js'):
              lines=p.read_text().splitlines()
              out=[];dirty=False
              for i,line in enumerate(lines,1):
                  if 'const goTab=async(page,id)=>' in line and '.tab-groups button' in line:
                      out.append(replacement);dirty=True
                  else:
                      out.append(line)
                      if '.tab-groups button' in line:
                          leftovers.append(f'{p}:{i}: {line.strip()}')
              if dirty:
                  p.write_text('\n'.join(out)+'\n');changed.append(str(p))
          print('Patched goTab helpers:')
          print('\n'.join(changed) or '(none)')
          print('\nOther tab-group references left for explicit tests:')
          print('\n'.join(leftovers) or '(none)')
          if not changed: raise SystemExit('No browser goTab helpers were patched')
          PY
          for f in $(git diff --name-only -- 'tests/*.js'); do node --check "$f"; done
      - name: Remove one-shot patch workflow
        run: git rm .github/workflows/patch-v0103-test-navigation.yml
      - name: Commit browser routing compatibility
        shell: bash
        run: |
          git add tests
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: route functional browser suites through hidden legacy router"
          git push
