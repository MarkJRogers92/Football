name: V0.10.5 Development Visualization Checkpoint

on:
  push:
    branches:
      - codex/v0105-development-visualization
    paths:
      - .github/workflows/v0105-development-visualization.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v0105-development-visualization-checkpoint
  cancel-in-progress: false

jobs:
  verify-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0105-development-visualization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Parse development visualization sources
        run: |
          node --check development-visualization-adapter.js
          node --check development-visualization.js
          node --check tests/development-visualization-model.js
          node --check tests/development-visual.js
      - name: Build standalone artifact
        run: npm run build
      - name: Targeted development regression
        run: node --test tests/development-visualization-model.js tests/development-results.js tests/development-tendencies.js tests/development-plans-v0955.js
      - name: Locate Chromium
        id: chromium
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            npx playwright-core install chromium
            browser="$(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chromium \) | head -1)"
          fi
          test -n "$browser"
          echo "path=$browser" >> "$GITHUB_OUTPUT"
      - name: Premium development visualization regression
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}
        run: node tests/development-visual.js
      - name: Commit generated artifact and retire helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/v0105-development-visualization.yml
          git commit -m "build: checkpoint v0.10.5 development visualization"
      - name: Verify clean reproducible release source
        run: npm run verify:release
      - name: Push verified checkpoint
        run: git push origin HEAD:codex/v0105-development-visualization
