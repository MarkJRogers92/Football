name: Promote v0.9.5 to production

on:
  push:
    branches:
      - codex/v095-coach-relationships

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Confirm release version
        run: test "$(cat VERSION.txt)" = "0.9.5"
      - name: Publish validated build to production
        run: npm run publish
      - name: Remove temporary promotion workflow
        shell: bash
        run: |
          rm -f .github/workflows/v095-promote.yml
          git config user.name "Dynasty Lab CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Remove temporary v0.9.5 promotion workflow"
            git push origin HEAD:codex/v095-coach-relationships
          fi
