name: Add v0.11.9 changelog

on:
  push:
    branches:
      - codex/v0119-options-about
    paths:
      - .github/workflows/add-v0119-changelog.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add release note
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const file='CHANGELOG.md';
          const text=fs.readFileSync(file,'utf8');
          if(/^## v0\.11\.9(?:\s|$)/m.test(text)) process.exit(0);
          const entry=`## v0.11.9 — Options and About menu polish\n\n- Reworks the title-screen Options panel into a clearer Game & Presentation settings screen while preserving the existing motion and Watch Mode pace preferences.\n- Adds device-default and local-preference guidance plus Restore Defaults without changing simulation behavior or dynasty save data.\n- Adds an About Dynasty Lab screen with the current version, game identity, Dynasty/Commissioner mode descriptions, and browser/JSON save model.\n- Adds dedicated desktop and iPhone browser coverage for menu navigation, version display, preference persistence/reset, viewport fit, and console errors.\n\n`;
          if(!text.startsWith('# Changelog\n')) throw new Error('Unexpected changelog header');
          fs.writeFileSync(file,'# Changelog\n\n'+entry+text.slice('# Changelog\n\n'.length));
          NODE
      - name: Commit release note
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: add v0.11.9 release note [full-ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
