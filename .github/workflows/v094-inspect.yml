name: v094 coaching inspection

on:
  push:
    branches:
      - codex/v094-coaching-careers

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show coaching-related source context
        shell: bash
        run: |
          echo '=== coaching symbols ==='
          grep -n -E 'coachArchive|coachId|recruiterCoach|function .*Coach|coaching|staff\.|movementLog|runOffseason|normalizeUniverse' app.js || true
          echo '=== staff rendering ==='
          grep -n -E 'renderStaff|staffList|schemeCard' app.js || true
          echo '=== test harness exports ==='
          tail -n 80 tools/harness.js
