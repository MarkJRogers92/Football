name: v0.12.4 TDD Gate

on:
  push:
    branches:
      - codex/v0124-first-season-flow
  workflow_dispatch:

permissions:
  contents: write

jobs:
  first-season-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build standalone artifact
        run: npm run build
      - name: Run pure first-season flow contract
        run: node --test tests/first-season-flow.js
      - name: Locate Chromium
        id: chromium
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            npx playwright-core install chromium
            browser="$(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chromium \) | head -1)"
          fi
          test -n "$browser"
          echo "path=$browser" >> "$GITHUB_OUTPUT"
      - name: Run browser first-season flow contract
        run: node tests/first-season-flow-browser.js
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}
      - name: Sync generated standalone artifact
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "build: sync v0.12.4 first-season flow"
          git push
