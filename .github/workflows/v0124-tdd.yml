name: v0.12.4 TDD Gate

on:
  push:
    branches:
      - codex/v0124-first-season-flow
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-season-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run first-season flow contract
        run: node --test tests/first-season-flow.js
