name: v0.12.4 TDD Gate

on:
  push:
    branches:
      - codex/v0124-first-season-flow
  workflow_dispatch:

permissions:
  contents: write

jobs:
  first-season-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sync release version markers in worktree
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const version=fs.readFileSync('VERSION.txt','utf8').trim().replace(/^Dynasty Lab\s*/,'').replace(/^v/,'');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          if(pkg.version!==version)throw new Error(`package.json ${pkg.version} does not match VERSION.txt ${version}`);
          let app=fs.readFileSync('app.js','utf8');
          if(!/APP_VERSION='[^']+'/.test(app))throw new Error('APP_VERSION marker not found');
          app=app.replace(/APP_VERSION='[^']+'/,`APP_VERSION='${version}'`);
          fs.writeFileSync('app.js',app);
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          lock.version=version;
          lock.packages[''].version=version;
          fs.writeFileSync('package-lock.json',JSON.stringify(lock,null,2)+'\n');
          let changelog=fs.readFileSync('CHANGELOG.md','utf8');
          if(!new RegExp(`^## v${version.replace(/\./g,'\\.')}\\s`,'m').test(changelog)){
            const section=`## v${version} — First-season coaching flow\n\n- Adds a Week Opening briefing that carries forward the actual previous result, existing Game Engine v2 game-plan feedback, the current opponent, required work, and factual player-story context.\n- Groups the Coaching Agenda into Required, Recommended, and Optional work while preserving the existing authoritative guidance meanings, snooze/restore state, and advancement gates.\n- Adds a five-stage Game Week path through opponent review, real weekly decisions, optional preparation, personnel review, and Game Day without duplicating controls or inventing blockers.\n- Keeps Weeks 1–2 explicit, condenses familiar non-required explanation text in Weeks 3–4, and returns to the normal coaching view afterward.\n- Keeps the feature derived and deterministic: no new gameplay RNG, save authority, simulation effects, or parallel checklist state.\n`;
            changelog=changelog.replace('# Changelog\n','# Changelog\n\n'+section+'\n');
            fs.writeFileSync('CHANGELOG.md',changelog);
          }
          NODE
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build standalone artifact
        run: npm run build
      - name: Run release version guard
        run: node tests/version.js
      - name: Run pure first-season flow contract
        run: node --test tests/first-season-flow.js
      - name: Locate Chromium
        id: chromium
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            npx playwright-core install chromium
            browser="$(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chromium \) | head -1)"
          fi
          test -n "$browser"
          echo "path=$browser" >> "$GITHUB_OUTPUT"
      - name: Run browser first-season flow contract
        run: node tests/first-season-flow-browser.js
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}
      - name: Sync release markers and generated artifact
        shell: bash
        run: |
          if git diff --quiet -- app.js package-lock.json CHANGELOG.md index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js package-lock.json CHANGELOG.md index.html
          git commit -m "build: sync v0.12.4 release markers"
          git push
