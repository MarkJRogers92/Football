name: V0.10.3 Premium Client Shell

on:
  push:
    branches:
      - codex/v0103-premium-client-shell
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v0103-premium-client-shell
  cancel-in-progress: true

jobs:
  shell-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Parse shell controller and test
        run: node --check client-shell.js && node --check tests/client-shell-browser.js
      - name: Build standalone artifact
        run: npm run build
      - name: Locate Chromium
        id: chromium
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            npx playwright-core install chromium
            browser="$(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chromium \) | head -1)"
          fi
          test -n "$browser"
          echo "path=$browser" >> "$GITHUB_OUTPUT"
      - name: Premium client shell browser regression
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}
        run: node tests/client-shell-browser.js
