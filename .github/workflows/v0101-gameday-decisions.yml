name: V0.10.1 Game Day Decisions

on:
  push:
    branches:
      - codex/v0101-gameday-coaching
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decision-foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Parse Game Day foundation
        run: node --check game-engine-v2-decisions.js && node --check game-engine-v2-gameday.js && node --check game-engine-v2-gameday-record.js && node --check game-engine-v2-gameday-ui.js && node --check tests/game-engine-v2-decisions.js && node --check tests/game-engine-v2-gameday.js && node --check tests/game-engine-v2-gameday-browser.js && node --check tests/game-engine-v2-gameday-record-browser.js
      - name: Fourth-down decision contract
        run: npm run test:game-engine-v2-decisions
      - name: Paused calibrated Game Day runner
        run: npm run test:game-engine-v2-gameday
      - name: Game Engine 2 targeted suite
        run: npm run test:game-engine-v2
      - name: Frozen calibration guardrail
        run: npm run test:game-engine-v2-calibration
      - name: Build standalone artifact
        run: npm run build
      - name: Verify Game Day modules are embedded
        run: grep -q "DynastyGameEngineV2Decisions" index.html && grep -q "DynastyGameEngineV2GameDay" index.html && grep -q "recordInteractiveV2GameDay" index.html && grep -q "v2InteractiveGameDay" index.html
      - name: Locate Chromium
        id: chromium
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            npx playwright-core install chromium
            browser="$(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chromium \) | head -1)"
          fi
          test -n "$browser"
          echo "path=$browser" >> "$GITHUB_OUTPUT"
      - name: Interactive Game Day staged browser regression
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}
        run: npm run test:game-engine-v2-gameday-browser
      - name: Interactive Game Day permanent commit regression
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}
        run: npm run test:game-engine-v2-gameday-record-browser
