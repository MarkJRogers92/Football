name: V0.10.3 V2 Lifecycle Gate

on:
  push:
    branches:
      - codex/v0103-v2-lifecycle-preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v0103-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Parse lifecycle regression
        run: node --check tests/game-engine-v2-lifecycle-browser.js
      - name: Game Engine 2 targeted suite
        run: npm run test:game-engine-v2
      - name: Frozen calibration gate
        run: npm run test:game-engine-v2-calibration
      - name: Build standalone artifact
        run: npm run build
      - name: Locate Chromium
        id: chromium
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            npx playwright-core install chromium
            browser="$(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chromium \) | head -1)"
          fi
          test -n "$browser"
          echo "path=$browser" >> "$GITHUB_OUTPUT"
      - name: Full dynasty lifecycle v2 regression
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}
        run: node tests/game-engine-v2-lifecycle-browser.js
