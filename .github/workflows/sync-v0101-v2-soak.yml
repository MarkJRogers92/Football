name: Sync v0.10.1 V2 Multiweek Soak

on:
  push:
    branches:
      - codex/v0101-v2-multiweek-soak

permissions:
  contents: write
  actions: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Parse multiweek v2 soak gate
        run: |
          node --check game-engine-v2-record-ui.js
          node --check tests/game-engine-v2-multiweek-browser.js
      - name: Targeted Game Engine 2 tests
        run: npm run test:game-engine-v2
      - name: Verify frozen calibration evidence
        run: npm run test:game-engine-v2-calibration
      - name: Build standalone artifact
        run: npm run build
      - name: Verify soak hook is packaged
        run: grep -q "v2RecordedSoakProbe" index.html
      - name: Locate Chromium
        id: chromium
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            npx playwright-core install chromium
            browser="$(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chromium \) | head -1)"
          fi
          test -n "$browser"
          echo "path=$browser" >> "$GITHUB_OUTPUT"
      - name: Single-game recorded v2 regression
        run: npm run test:game-engine-v2-recorded-browser
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}
      - name: Six-week recorded v2 soak
        run: npm run test:game-engine-v2-multiweek-browser
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}
      - name: Commit synchronized artifact and remove helper
        run: |
          rm .github/workflows/sync-v0101-v2-soak.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/sync-v0101-v2-soak.yml
          git commit -m "build: sync v0.10.1 v2 multiweek soak [skip ci]"
          git push origin HEAD:codex/v0101-v2-multiweek-soak
      - name: Dispatch full validator on synchronized head
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run validate.yml --ref codex/v0101-v2-multiweek-soak
