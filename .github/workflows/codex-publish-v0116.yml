name: Publish Dynasty Lab v0.11.6

on:
  push:
    branches:
      - claude/review-improvement-dwjemy

permissions:
  contents: write

jobs:
  release-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/review-improvement-dwjemy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Bump release version
        shell: bash
        run: |
          printf '0.11.6\n' > VERSION.txt
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          p.version='0.11.6';
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          NODE
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          old="const APP_VERSION='0.11.5';"
          new="const APP_VERSION='0.11.6';"
          if old not in s:
              raise SystemExit('APP_VERSION 0.11.5 anchor not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Build standalone artifact
        run: npm run build
      - name: Version checks
        run: node --test tests/version.js
      - name: Persistence regression
        run: node --test tests/persistence.js
      - name: Commit release
        shell: bash
        run: |
          rm .github/workflows/codex-publish-v0116.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION.txt package.json app.js index.html .github/workflows/codex-publish-v0116.yml
          git commit -m "Release v0.11.6: harden untrusted save imports"
          git push origin HEAD:claude/review-improvement-dwjemy
      - name: Publish production
        run: node tools/publish.js
