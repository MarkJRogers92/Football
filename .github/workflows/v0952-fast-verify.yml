name: v0952 focused verify
on:
  push:
    branches: [codex/v0952-program-goals-polish]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-package-lock
      - name: Build and release source
        run: |
          npm run build
          git diff --exit-code -- index.html
          npm run verify:release
      - name: Regression that failed canonical validation
        run: node --test tests/weeklyplan.js
      - name: v0.9.52 goal regressions
        run: node --test tests/season-goals.js tests/season-goals-v0952.js
