name: Patch v0.10.3 browser weekly gate

on:
  push:
    branches:
      - codex/v0103-premium-client-shell
    paths:
      - .github/workflows/patch-v0103-browser-weekly-gate.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0103-premium-client-shell
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Patch browser smoke test for legitimate weekly decision gate
        shell: python
        run: |
          from pathlib import Path
          p = Path('tests/browser.js')
          text = p.read_text()
          old = """    // Simulate a week and confirm the UI advances.\n    await goTab(page, 'dashboard');\n    const t0 = Date.now();\n    await page.click('#simWeek');\n"""
          new = """    // Simulate a week and confirm the UI advances. Weekly coaching can\n    // legitimately gate advancement behind unresolved decisions, so clear those\n    // decisions through their real UI before testing the Sim Week action.\n    await goTab(page, 'dashboard');\n    for (let guard = 0; guard < 6 && await page.$eval('#simWeek', el => el.disabled); guard++) {\n      const resolved = await page.evaluate(() => {\n        const button = [...document.querySelectorAll('[data-decision][data-choice]')]\n          .find(el => !el.disabled && el.offsetParent !== null);\n        if (!button) return false;\n        button.click();\n        return true;\n      });\n      if (!resolved) break;\n      await page.waitForTimeout(80);\n    }\n    const simReady = await page.$eval('#simWeek', el => !el.disabled);\n    check(`[${label}] weekly decision gate clears before sim`, simReady);\n    if (!simReady) throw new Error(`[${label}] Sim Week remained disabled after resolving visible weekly decisions`);\n    const t0 = Date.now();\n    await page.click('#simWeek');\n"""
          if old not in text:
              raise SystemExit('expected browser smoke snippet not found; refusing broad patch')
          p.write_text(text.replace(old, new, 1))
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build standalone artifact
        run: npm run build
      - name: Verify test-only patch leaves committed build current
        run: git diff --exit-code -- index.html
      - name: Locate Chromium
        id: chromium
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            npx playwright-core install chromium
            browser="$(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chromium \) | head -1)"
          fi
          test -n "$browser"
          echo "path=$browser" >> "$GITHUB_OUTPUT"
      - name: Run targeted browser regression
        run: node tests/browser.js
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}
      - name: Commit verified compatibility fix and remove helper
        shell: bash
        run: |
          rm .github/workflows/patch-v0103-browser-weekly-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser.js .github/workflows/patch-v0103-browser-weekly-gate.yml
          git commit -m "test: resolve weekly decisions before browser sim"
          git push origin HEAD:codex/v0103-premium-client-shell
