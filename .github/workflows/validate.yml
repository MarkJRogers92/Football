name: Validate Dynasty Lab

on:
  pull_request:
  push:
    branches-ignore:
      - gh-pages
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dynasty-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cadence:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.cadence.outputs.mode }}
      desktop: ${{ steps.cadence.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select validation cadence
        id: cadence
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          mode="fast"
          reason="normal push"
          if [ "$EVENT_NAME" != "push" ]; then
            mode="full"
            reason="$EVENT_NAME event"
          elif git log -1 --pretty=%B | grep -Eiq '\[(full-ci|release-ci)\]'; then
            mode="full"
            reason="commit requested full CI"
          else
            count="$(git rev-list --count --first-parent HEAD)"
            if [ $((count % 4)) -eq 0 ]; then
              mode="full"
              reason="four-commit cadence"
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Validation mode: $mode ($reason)"

          # Desktop packaging is slow (macOS/Windows runners), so build it only when a
          # change can affect it, when a commit asks for it, or on manual dispatch.
          desktop="false"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            desktop="true"
          elif git log -1 --pretty=%B | grep -Eiq '\[(release-ci|desktop-ci)\]'; then
            desktop="true"
          else
            if [ "$EVENT_NAME" = "pull_request" ]; then
              base="HEAD^1"
            elif [ -n "$BEFORE_SHA" ] && ! [[ "$BEFORE_SHA" =~ ^0+$ ]] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              base="$BEFORE_SHA"
            else
              base="HEAD~1"
            fi
            if git diff --name-only "$base" HEAD | grep -Eq '^(desktop/|forge\.config\.js$|package(-lock)?\.json$|tools/rename-desktop-zip\.js$|tests/desktop-)'; then
              desktop="true"
            fi
          fi
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "Desktop packaging: $desktop"

  desktop-macos:
    needs: cadence
    if: needs.cadence.outputs.desktop == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build arm64 macOS desktop package
        run: npm run desktop:make
      - name: Smoke test packaged desktop app
        run: node tests/desktop-smoke.js --packaged
      - name: Upload arm64 macOS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: dynasty-lab-desktop-alpha-macos-arm64-${{ github.sha }}
          path: out/make/zip/darwin/arm64/Dynasty-Lab-Desktop-Alpha-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 14

  desktop-windows:
    needs: cadence
    if: needs.cadence.outputs.desktop == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build x64 Windows desktop package
        run: npm run desktop:make:windows
      - name: Smoke test packaged desktop app
        run: node tests/desktop-smoke.js --packaged
      - name: Upload x64 Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: dynasty-lab-desktop-alpha-windows-x64-${{ github.sha }}
          path: out/make/zip/win32/x64/Dynasty-Lab-Desktop-Alpha-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  validate:
    needs: cadence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build standalone artifact
        run: npm run build
      - name: Verify committed build is current
        run: git diff --exit-code -- index.html
      - name: Verify releasable source tree
        run: npm run verify:release
      - name: Fast smoke and version checks
        run: node tests/version.js && node tests/smoke.js
      - name: Engine and presentation unit tests
        run: npm test

  browser:
    needs: cadence
    if: needs.cadence.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build standalone artifact
        run: npm run build
      - name: Verify committed build is current
        run: git diff --exit-code -- index.html
      - name: Locate Chromium
        id: chromium
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            npx playwright-core install chromium
            browser="$(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chromium \) | head -1)"
          fi
          test -n "$browser"
          echo "path=$browser" >> "$GITHUB_OUTPUT"
      - name: Browser UI and visual regression tests
        run: npm run test:browser
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}
      - name: Browser IndexedDB regression check
        run: npm run test:browser-storage
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}

  browser-extended:
    needs: cadence
    if: needs.cadence.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build standalone artifact
        run: npm run build
      - name: Verify committed build is current
        run: git diff --exit-code -- index.html
      - name: Locate Chromium
        id: chromium
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            npx playwright-core install chromium
            browser="$(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chromium \) | head -1)"
          fi
          test -n "$browser"
          echo "path=$browser" >> "$GITHUB_OUTPUT"
      - name: Extended feature browser suites
        run: npm run test:browser-extended
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}

  audit:
    needs: cadence
    if: needs.cadence.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build standalone artifact
        run: npm run build
      - name: Simulation audit
        run: npm run audit
