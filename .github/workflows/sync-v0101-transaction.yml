name: Sync v0.10.1 Transaction Dry Run

on:
  push:
    branches:
      - codex/v0101-transactional-v2

permissions:
  contents: write
  actions: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Parse transactional module
        run: node --check game-engine-v2-transaction.js
      - name: Targeted Game Engine 2 transaction tests
        run: npm run test:game-engine-v2
      - name: Verify frozen calibration evidence
        run: npm run test:game-engine-v2-calibration
      - name: Build standalone artifact
        run: npm run build
      - name: Verify transaction proof is packaged
        run: |
          grep -q "DynastyGameEngineV2Transaction" index.html
          grep -q "Archive transaction dry run: PASS" index.html
      - name: Commit synchronized artifact and remove helper
        run: |
          rm .github/workflows/sync-v0101-transaction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/sync-v0101-transaction.yml
          git commit -m "build: sync v0.10.1 transaction dry run [skip ci]"
          git push origin HEAD:codex/v0101-transactional-v2
      - name: Dispatch validator on synchronized head
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run validate.yml --ref codex/v0101-transactional-v2
