name: Sync v0.10.0 Game Engine 2 build

on:
  push:
    branches:
      - codex/v0100-game-engine-2

permissions:
  contents: write
  actions: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Targeted Game Engine 2 tests
        run: npm run test:game-engine-v2
      - name: Build standalone artifact
        run: npm run build
      - name: Commit synchronized artifact and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sync-v0100-build.yml
          git add index.html
          git commit -m "build: sync v0.10.0 Game Engine 2 foundation"
          git push
      - name: Dispatch validator on synchronized head
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run validate.yml --ref "$GITHUB_REF_NAME"
