name: Check v0.9.54 recruiting history prototype

on:
  push:
    branches:
      - codex/v0954-receipt-history-prototype

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-package-lock
      - name: Focused receipt history tests
        run: node --test tests/scouting-receipts.js tests/recruiting-history.js
      - name: Build standalone prototype
        run: npm run build
      - name: Verify history surface is bundled
        run: |
          grep -q "Recruiting Class History" index.html
          grep -q "Historical classes use the same maturation gates" index.html
      - name: Locate Chromium
        id: chromium
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            npx playwright-core install chromium
            browser="$(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chromium \) | head -1)"
          fi
          test -n "$browser"
          echo "path=$browser" >> "$GITHUB_OUTPUT"
      - name: Recruiting browser integration
        run: node tests/recruit-visual.js
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}
