name: Sync v0.9.55 standalone build

on:
  push:
    branches:
      - codex/v0955-staff-recruiting-development
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-v0955-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build standalone artifact
        run: node tools/build.js
      - name: Commit generated artifact when needed
        id: generated
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Standalone artifact is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "build: sync v0.9.55 standalone artifact"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Validate synchronized branch
        if: steps.generated.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run validate.yml --ref "$GITHUB_REF_NAME"
