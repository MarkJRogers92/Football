name: V0.10.9 Game Day and Season Checkpoint

on:
  push:
    branches:
      - codex/v0109-gameday-season-presentation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v0109-gameday-season-checkpoint
  cancel-in-progress: true

jobs:
  verify-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0109-gameday-season-presentation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Parse Game Day and Season presentation sources
        run: |
          node --check season-presentation-adapter.js
          node --check gameday-season-presentation.js
          node --check tests/season-presentation-model.js
          node --check tests/gameday-season-presentation-browser.js
      - name: Build standalone artifact
        run: npm run build
      - name: Season presentation model regression
        run: node tests/season-presentation-model.js
      - name: Locate Chromium
        id: chromium
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            npx playwright-core install chromium
            browser="$(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chromium \) | head -1)"
          fi
          test -n "$browser"
          echo "path=$browser" >> "$GITHUB_OUTPUT"
      - name: Game Day and Season browser regression
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}
        run: node tests/gameday-season-presentation-browser.js
      - name: Commit generated artifact and retire helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/v0109-gameday-season-checkpoint.yml
          if ! git diff --cached --quiet; then
            git commit -m "build: checkpoint v0.10.9 Game Day and Season presentation"
          fi
      - name: Verify clean reproducible release source
        run: |
          npm run build
          git diff --exit-code -- index.html
          npm run verify:release
      - name: Push verified checkpoint
        run: git push origin HEAD:codex/v0109-gameday-season-presentation
