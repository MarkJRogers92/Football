name: V0.11.1 Motion and Final Polish Checkpoint

on:
  push:
    branches:
      - codex/v0111-motion-final-polish
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0111-motion-final-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Parse motion sources
        run: |
          node --check interaction-polish.js
          node --check tests/interaction-polish-browser.js
      - name: Build standalone artifact
        run: npm run build
      - name: Locate Chromium
        id: chromium
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            npx playwright-core install chromium
            browser="$(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chromium \) | head -1)"
          fi
          test -n "$browser"
          echo "path=$browser" >> "$GITHUB_OUTPUT"
      - name: Motion and reduced-motion browser regression
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}
        run: node tests/interaction-polish-browser.js
      - name: Client shell regression
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}
        run: node tests/client-shell-browser.js
      - name: Commit generated artifact and retire helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/v0111-motion-polish-checkpoint.yml
          if ! git diff --cached --quiet; then
            git commit -m "build: checkpoint v0.11.1 motion and final polish"
          fi
      - name: Verify clean reproducible release source
        run: |
          npm run build
          git diff --exit-code -- index.html
          npm run verify:release
      - name: Push verified checkpoint
        run: git push origin HEAD:codex/v0111-motion-final-polish
