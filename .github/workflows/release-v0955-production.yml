name: Release v0.9.55 Production

on:
  push:
    branches:
      - codex/v0955-staff-recruiting-development
    paths:
      - .github/workflows/release-v0955-production.yml

permissions:
  contents: write

concurrency:
  group: dynasty-publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prepare v0.9.55 release tree
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('app.js','utf8');
          const next=app.replace(/const APP_VERSION='[^']+';/,"const APP_VERSION='0.9.55';");
          if(next===app) throw new Error('APP_VERSION marker not found');
          fs.writeFileSync('app.js',next);
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.version='0.9.55';
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          NODE
          printf '0.9.55\n' > VERSION.txt
          cat > /tmp/v0955-note <<'EOF'
          ## v0.9.55 — Staff, Recruiting Battles and Development Plans

          - Gives coaching staffs durable scouting identities with deterministic evaluation specialties tied to coach identity.
          - Adds a Staff Evaluation Ledger that grades settled recruiting reads from observed player outcomes without exposing hidden ratings or growth curves.
          - Makes recruiting races more legible with race position, leader gaps, momentum, decision pressure, challenged commitments and bounded battle history.
          - Adds three weekly Priority Pushes, each worth a modest +4 pitch boost, so attention can matter without overwhelming the existing recruiting model.
          - Adds up to five Featured Development Plans per offseason. Plans concentrate existing training effects and preserve the underlying hidden-potential ceiling rather than creating guaranteed growth.
          - Adds spring/fall development-plan receipts and keeps the new systems additive to existing saves.

          EOF
          cat /tmp/v0955-note CHANGELOG.md > /tmp/CHANGELOG.md
          mv /tmp/CHANGELOG.md CHANGELOG.md
          cat > docs/v0955-RELEASE-NOTE.md <<'EOF'
          # Dynasty Lab v0.9.55 — Staff, Recruiting Battles and Development Plans

          v0.9.55 deepens three linked decision loops without exposing hidden truth.

          ## Staff scouting identity
          Coaches now carry deterministic evaluation specialties tied to durable coach identity. Relevant expertise improves evaluation efficiency, while the Staff Evaluation Ledger grades only settled observed outcomes from prior signees.

          ## Recruiting battles
          Recruiting races now show race position, leader gap, momentum, decision pressure, challenged commitments and short battle history. The controlled program receives three Priority Pushes per week; each adds a bounded +4 pitch boost for that week.

          ## Featured development plans
          Up to five players per offseason can receive Featured Development Plans using the existing training-focus system. Plans concentrate development attempts rather than increasing hidden upside or guaranteeing gains, and spring/fall receipts preserve what actually happened.

          Hidden true ratings, hidden upside, growth profile/volatility and other anti-cheat information remain excluded from player-facing scouting judgments and historical staff grades.
          EOF
          cat > docs/v0955-VALIDATION.md <<'EOF'
          # Dynasty Lab v0.9.55 — Validation

          Release candidate is produced and validated by the one-shot `Release v0.9.55 Production` workflow.

          Required gates:
          - standalone build;
          - committed-build freshness;
          - releasable source-tree verification;
          - complete engine/presentation suite including v0.9.55 focused tests;
          - Chromium UI and visual regression suite;
          - browser IndexedDB regression;
          - simulation audit;
          - production publication only after every gate succeeds.

          Production authorization was explicitly given in chat on September 6, 2026.
          EOF
          rm -f .github/workflows/sync-v0955-build.yml .github/workflows/release-v0955-production.yml

      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Build standalone artifact
        run: npm run build
      - name: Commit exact release candidate locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: prepare v0.9.55 production [skip ci]'
      - name: Verify committed build is current
        run: |
          npm run build
          git diff --exit-code -- index.html
      - name: Verify releasable source tree
        run: npm run verify:release
      - name: Engine and presentation tests
        run: npm test
      - name: Locate Chromium
        id: chromium
        shell: bash
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            npx playwright-core install chromium
            browser="$(find "$HOME/.cache/ms-playwright" -type f \( -name chrome -o -name chromium \) | head -1)"
          fi
          test -n "$browser"
          echo "path=$browser" >> "$GITHUB_OUTPUT"
      - name: Browser UI and visual regression tests
        run: npm run test:browser
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}
      - name: Browser IndexedDB regression check
        run: npm run test:browser-storage
        env:
          CHROMIUM_PATH: ${{ steps.chromium.outputs.path }}
      - name: Simulation audit
        run: npm run audit
      - name: Push validated release candidate
        shell: bash
        run: git push origin HEAD:codex/v0955-staff-recruiting-development
      - name: Publish v0.9.55 production
        run: node tools/publish.js
