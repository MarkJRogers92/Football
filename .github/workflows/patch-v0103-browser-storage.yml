name: Patch v0.10.3 shell persistence navigation

on:
  push:
    branches:
      - codex/v0103-premium-client-shell
    paths:
      - .github/workflows/patch-v0103-browser-storage.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Adapt persistence test to shell utility surface
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/browser-storage.js')
          s=p.read_text()
          anchor="const startNewDynasty=async page=>{await page.waitForSelector('#titleNew',{timeout:30000});await page.waitForFunction(()=>document.querySelector('#titleTeam')?.options.length>0,{timeout:60000});await page.click('#titleNew');await page.waitForSelector('#titleStart',{state:'visible',timeout:10000});await page.click('#titleStart');await page.waitForFunction(()=>document.querySelector('#userTeam')?.options.length>0,{timeout:60000})};\n"
          helper="""const clickShellUtility=async(page,selector)=>{\n const target=page.locator(selector);if(await target.isVisible()){await target.click();return}\n const quick=page.locator('.client-mobile-nav');if(await quick.count()&&await quick.isVisible()&&!await page.$eval('#app',el=>el.classList.contains('client-rail-open')))await page.click('[data-client-more]');\n const details=page.locator('.client-utilities');if(await details.count()&&!await details.evaluate(el=>el.open))await details.locator('summary').click();\n await page.locator(selector).click();\n};\n"""
          if 'const clickShellUtility=' not in s:
              if anchor not in s: raise SystemExit('startNewDynasty anchor not found')
              s=s.replace(anchor,anchor+helper,1)
          for selector in ('#saveBrowser','#loadBrowser','#exportSave'):
              s=s.replace(f"await page.click('{selector}')",f"await clickShellUtility(page,'{selector}')")
          p.write_text(s)
          PY
          node --check tests/browser-storage.js
      - name: Remove one-shot patch workflow
        run: git rm .github/workflows/patch-v0103-browser-storage.yml
      - name: Commit compatibility update
        shell: bash
        run: |
          git add tests/browser-storage.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: route persistence controls through premium shell utilities"
          git push
