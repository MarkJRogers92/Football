name: Codex import-save hardening

on:
  push:
    branches:
      - codex/v0115-import-save-hardening

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0115-import-save-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Apply narrow patch
        run: python tools/codex_patch_import.py
      - name: Build standalone
        run: node tools/build.js
      - name: Run targeted persistence tests
        run: node --test tests/persistence.js
      - name: Run version checks
        run: node --test tests/version.js
      - name: Commit tested patch
        run: |
          rm .github/workflows/codex-import-hardening.yml tools/codex_patch_import.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js tests/persistence.js index.html .github/workflows/codex-import-hardening.yml tools/codex_patch_import.py
          git commit -m "fix: harden untrusted save imports without slowing browser loads"
          git push origin HEAD:codex/v0115-import-save-hardening
