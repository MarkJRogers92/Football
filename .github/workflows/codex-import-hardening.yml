name: Codex import-save hardening

on:
  push:
    branches:
      - codex/v0115-import-save-hardening

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0115-import-save-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Apply narrow import-save hardening patch
        shell: python
        run: |
          from pathlib import Path

          app = Path('app.js')
          src = app.read_text()
          old = r'''// Team name is the one user-editable string (via applyProgramEdit) that reaches raw
// innerHTML across the app (standings, schedules, recruiting) instead of .textContent.
// Every other name in a save — players, coaches, recruits, recap/log text — comes from
// fixed internal word pools and was never typed by a user, so it cannot carry injected
// markup; walking the whole save to re-check it would just be an O(save size) load-time
// cost with nothing left to catch. Scoped here to what a save can actually make unsafe.
function validateSaveText(u){
  for(const t of u.teams||[])
    if(typeof t?.name==='string'&&/[<>\\\"]/.test(t.name))
      throw new Error('Invalid dynasty save. A team name contains unsafe markup.');
}
'''
          new = r'''// Browser saves are generated by Dynasty Lab itself, so their hot load path only needs
// to re-check the one user-editable string that is widely rendered through innerHTML.
// Portable JSON imports are a different trust boundary: validateImportedSaveText() below
// walks those once before installation so an edited file cannot inject markup through
// player names, logs, IDs, recap text, or any other save-backed render surface.
function validateSaveText(u){
  for(const t of u.teams||[])
    if(typeof t?.name==='string'&&/[<>\\\"]/.test(t.name))
      throw new Error('Invalid dynasty save. A team name contains unsafe markup.');
}
function validateImportedSaveText(value){
  const pending=[value],seen=new WeakSet();
  while(pending.length){
    const current=pending.pop();
    if(typeof current==='string'){
      // Angle brackets can create tags in text-context innerHTML. A quote followed by an
      // attribute assignment can break out of quoted data-* / value attributes without
      // requiring a tag of its own. javascript: covers active URL payloads if a save-backed
      // string is ever routed into a URL-bearing surface.
      if(/[<>]/.test(current)||/[\"']\\s*[A-Za-z_:][-A-Za-z0-9_:.]*\\s*=/.test(current)||/\\bjavascript\\s*:/i.test(current))
        throw new Error('Invalid dynasty save. Imported text contains unsafe markup.');
      continue;
    }
    if(!current||typeof current!=='object'||seen.has(current))continue;
    seen.add(current);
    for(const item of Object.values(current))pending.push(item);
  }
}
'''
          if old not in src:
              raise SystemExit('validateSaveText anchor not found')
          src = src.replace(old, new, 1)
          old_import = r'''  if(d.storageVersion||d.archiveRef)throw new Error('Import a complete exported JSON save, not a browser storage record.');
  installSave(d);setStatus('Imported save file successfully.');
'''
          new_import = r'''  if(d.storageVersion||d.archiveRef)throw new Error('Import a complete exported JSON save, not a browser storage record.');
  validateImportedSaveText(d?.universe||d);
  installSave(d);setStatus('Imported save file successfully.');
'''
          if old_import not in src:
              raise SystemExit('importSave anchor not found')
          app.write_text(src.replace(old_import, new_import, 1))

          test = Path('tests/persistence.js')
          t = test.read_text()
          anchor = '''  const before=e.universe;\n  await e.importSave('{bad json');'''
          replacement = '''  // Portable imports are untrusted even when their shape matches a real export. Quotes in\n  // ordinary generated prose remain valid, but markup and attribute-breakout payloads must\n  // be rejected before installSave() can render any save-backed string.\n  const quoted=JSON.parse(JSON.stringify(exported));quoted.universe.movementLog=['Coach "Ace" Miller was hired.'];\n  await e.importSave(JSON.stringify(quoted));assert.match(e.$el('#saveStatus').textContent,/Imported/);\n  const before=e.universe;\n  const unsafeLog=JSON.parse(JSON.stringify(exported));unsafeLog.universe.movementLog=['<img src=x onerror=alert(1)>'];\n  await e.importSave(JSON.stringify(unsafeLog));assert.equal(e.universe,before);\n  assert.match(e.$el('#saveStatus').textContent,/unsafe markup/);\n  const unsafeId=JSON.parse(JSON.stringify(exported));unsafeId.universe.teams[0].roster[0].id='p1" onmouseover=alert(1) data-x="';\n  await e.importSave(JSON.stringify(unsafeId));assert.equal(e.universe,before);\n  assert.match(e.$el('#saveStatus').textContent,/unsafe markup/);\n  await e.importSave('{bad json');'''
          if anchor not in t:
              raise SystemExit('persistence test anchor not found')
          test.write_text(t.replace(anchor, replacement, 1))
      - name: Build standalone
        run: node tools/build.js
      - name: Run targeted persistence tests
        run: node --test tests/persistence.js
      - name: Run version checks
        run: node --test tests/version.js
      - name: Commit tested patch and remove runner
        shell: bash
        run: |
          rm .github/workflows/codex-import-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js tests/persistence.js dynasty-lab-standalone.html .github/workflows/codex-import-hardening.yml
          git commit -m "fix: harden untrusted save imports without slowing browser loads"
          git push origin HEAD:codex/v0115-import-save-hardening
